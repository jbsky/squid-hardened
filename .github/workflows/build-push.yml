# =====================================================================
#  build-push -- squid-hardened, c-icap-hardened, clamav-hardened
#
#  Tout le pipeline vient du gabarit de jbsky/hardened-ci (lint, build des
#  trois images, test EICAR qui les traverse, garde de revision par image,
#  promotion signee, SBOM attestee, README, purge, release, issue si echec).
#  Ce depot ne decrit que ce qui le distingue : .github/hardened-ci.json.
#
#  Ce fichier faisait 1187 lignes jusqu'au 2026-10-14. Le depot etait le seul
#  du parc hors gabarit, donc sans hardened-ci.json -- donc hors des controles
#  que ce fichier rend possibles (dont le nom d'image de cve-watch, qui a
#  laisse l'audit CVE de haproxy muet 10 jours).
#
#  Les trois images sont UN SEUL appel, pas trois : le test EICAR les eprouve
#  ensemble (squid -> c-icap -> clamav), et aucune n'est promue si la chaine
#  echoue. Chacune garde son compteur de revision : un commit sous squid/ ne
#  fait pas monter la revision de clamav.
#
#  Le filtre paths: doit couvrir les entrees du compteur des trois images :
#  le gabarit le verifie (hci-config.py --check).
# =====================================================================
name: build-push

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
    paths:
      - 'squid/**'
      - 'c-icap/**'
      - 'clamav/**'
      - 'versions.json'
      - 'scripts/**'
      - 'docker-compose.yml'
      - '.github/hardened-ci.json'
      - '.github/workflows/build-push.yml'
  pull_request:
    branches: [main]
    # Sans cette liste, une PR qui ne touche que le workflow passerait sans
    # aucun controle et serait eprouvee pour la premiere fois sur main.
    paths:
      - 'squid/**'
      - 'c-icap/**'
      - 'clamav/**'
      - 'versions.json'
      - 'scripts/**'
      - 'docker-compose.yml'
      - '.github/hardened-ci.json'
      - '.github/workflows/build-push.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pipeline:
    uses: jbsky/hardened-ci/.github/workflows/build-push.yml@88bfa0599e83e6b25934715df2e4a370994b89d6 # v1.4.2
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
      security-events: write
      issues: write
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
