# =====================================================================
#  Build & Push – Dockerfiles multi-stage → ghcr.io + Docker Hub.
#
#  Il a existé un second chemin, Docker Hardened Images (définitions YAML
#  déclaratives buildées par le frontend dhi.io/build). Il est supprimé :
#  DHI est un produit payant, il n'a jamais tourné ici faute du secret
#  DOCKER_USERNAME, et ses définitions installaient des paquets apk là où
#  les Dockerfiles compilent depuis les sources -- deux définitions de la
#  même image qui divergeaient en silence.
#
#  Architecture multi-arch :
#    - Chaque plateforme (amd64, arm64) est un job séparé en parallèle
#    - Les digests sont uploadés en artifacts
#    - Un job merge crée le manifest multi-arch + signe + scanne
# =====================================================================
name: build-push

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
    paths:
      - 'squid/**'
      - 'c-icap/**'
      - 'clamav/**'
      - 'versions.json'
      - 'scripts/**'
      - '.github/workflows/build-push.yml'
  pull_request:
    branches: [main]
    paths:
      - 'squid/**'
      - 'c-icap/**'
      - 'clamav/**'
      - 'versions.json'
      # Without this the push trigger builds workflow changes but the PR
      # trigger does not, so a PR that only edits this file merges with zero
      # checks and is first exercised on main. The push list above already
      # includes it; this keeps the two in step.
      - 'scripts/**'
      - '.github/workflows/build-push.yml'
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Target platforms'
        required: false
        default: 'linux/amd64'
        type: choice
        options:
          - 'linux/amd64'
          - 'linux/arm64'
          - 'linux/amd64,linux/arm64'

env:
  REGISTRY: ghcr.io
  NAMESPACE: ${{ github.repository_owner }}

permissions:
  contents: read
  packages: write
  id-token: write
  security-events: write
  attestations: write

jobs:
  # -------------------------------------------------------------------
  #  Lint (Hadolint + ShellCheck) – toujours, y compris en PR
  # -------------------------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Hadolint – squid/Dockerfile
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: squid/Dockerfile
          failure-threshold: warning

      - name: Hadolint – c-icap/Dockerfile
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: c-icap/Dockerfile
          failure-threshold: warning

      - name: Hadolint – clamav/Dockerfile
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: clamav/Dockerfile
          failure-threshold: warning

      - name: ShellCheck – scripts
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: ./scripts


      # versions.json est la seule source des versions du build (les trois
      # images) ; le test unitaire prouve que le controle attrape chaque derive.
      - name: Versions -- source unique
        run: |
          python3 -m unittest discover -s scripts -p 'test_versions_build_args.py' -v
          ./scripts/versions-build-args.py --check

      # Trois modules Go dans un depot : chacun a son go.mod, donc `go vet` et
      # `go test` doivent tourner depuis chaque repertoire. `gofmt`, lui, prend
      # les trois d'un coup.
      - uses: actions/setup-go@v7
        with:
          go-version-file: squid/go.mod

      - name: gofmt
        run: |
          set -euo pipefail
          fmt_out=$(gofmt -l squid c-icap clamav)
          if [ -n "$fmt_out" ]; then
            echo "::error::gofmt found unformatted files:"
            echo "$fmt_out"
            exit 1
          fi

      - name: go vet
        run: |
          set -euo pipefail
          for m in squid c-icap clamav; do
            echo "== $m"
            (cd "$m" && go vet ./...)
          done

      - name: go test
        run: |
          set -euo pipefail
          for m in squid c-icap clamav; do
            echo "== $m"
            (cd "$m" && go test ./...)
          done

  # -------------------------------------------------------------------
  #  Build the 3 images locally. On a real
  #  push/tag (never on pull_request -- fork PRs must never get registry
  #  push credentials) each is pushed BY DIGEST, so `test` below can pull
  #  those exact digests back and exercise the real squid -> c-icap ->
  #  clamav ICAP chain with an EICAR download against those literal
  #  bytes. On a PR there's no registry to push to, so each image is
  #  instead exported to a local tarball and handed to `test` (a separate
  #  job/runner) as an artifact.
  # -------------------------------------------------------------------
  build:
    name: Build images
    needs: lint
    runs-on: ubuntu-latest
    outputs:
      digest-clamav: ${{ steps.build-clamav.outputs.digest }}
      digest-cicap: ${{ steps.build-cicap.outputs.digest }}
      digest-squid: ${{ steps.build-squid.outputs.digest }}
    env:
      # true on a real push/tag to this repo (never on pull_request -- fork
      # PRs must never get registry push credentials); gates every
      # push-by-digest / login / digest-export step below. On a PR, images
      # are still built and functionally tested (via a tarball handoff to
      # `test`), just never pushed anywhere.
      PUBLISH: ${{ github.event_name != 'pull_request' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v7

      # Build-args generes depuis versions.json (le controle tourne avec) :
      # chaque docker/build-push-action du job doit les recevoir.
      - name: Build-args depuis versions.json
        id: build-args
        uses: jbsky/hardened-ci/versions@9ca47b8942dd2ba041644dd345bbdb34a26ef6d0 # v0.9.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login ghcr.io
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Scan each image's Alpine runtime-deps stage (moved here from
      # build-dockerfile since amd64 -- the only platform these can --load
      # -- is now always built in this job, never there; runs on every PR
      # too, not just push). The target is `prep` for all three: it is the
      # stage that holds exactly the runtime packages that ship. Pointing it
      # at `builder` would scan the compiler toolchain instead and flood the
      # SARIF category with CVEs from packages no image ever contains.
      - name: Build prep stage (Alpine with runtime deps) - clamav-hardened
        uses: docker/build-push-action@v7
        with:
          build-args: ${{ steps.build-args.outputs.build-args }}
          context: clamav/
          file: clamav/Dockerfile
          target: prep
          platforms: linux/amd64
          load: true
          tags: clamav-hardened-prep:scan
          no-cache-filters: prep
          cache-from: type=gha,scope=clamav-hardened-prep

      - name: Trivy scan prep stage (Alpine CVEs) - clamav-hardened
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: clamav-hardened-prep:scan
          format: sarif
          output: trivy-clamav-hardened-deps.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'
          ignore-unfixed: true

      - name: Upload prep SARIF - clamav-hardened
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-clamav-hardened-deps.sarif
          category: clamav-hardened-deps

      # SBOM des paquets du stage prep, attestee sur l'image publiee (job
      # merge-dockerfile). L'image finale FROM scratch n'a plus de base apk :
      # c'est le seul moyen de re-auditer plus tard ce qui a ete publie
      # (cve-watch.yml). prep est reconstruit ici a part du build final : la
      # SBOM decrit la meme resolution apk a quelques minutes pres.
      - name: SBOM of prep stage (CycloneDX) - clamav-hardened
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: clamav-hardened-prep:scan
          format: cyclonedx
          output: sbom-prep-clamav-hardened.cdx.json

      - name: Upload prep SBOM - clamav-hardened
        uses: actions/upload-artifact@v7
        with:
          name: sbom-prep-clamav-hardened
          path: sbom-prep-clamav-hardened.cdx.json
          if-no-files-found: error

      - name: Trivy gate prep stage (fail on fixable CRITICAL) - clamav-hardened
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: clamav-hardened-prep:scan
          format: table
          severity: CRITICAL
          exit-code: '1'
          ignore-unfixed: true

      - name: Build prep stage (Alpine with runtime deps) - c-icap-hardened
        uses: docker/build-push-action@v7
        with:
          build-args: ${{ steps.build-args.outputs.build-args }}
          context: c-icap/
          file: c-icap/Dockerfile
          target: prep
          platforms: linux/amd64
          load: true
          tags: c-icap-hardened-prep:scan
          no-cache-filters: prep
          cache-from: type=gha,scope=c-icap-hardened-prep

      - name: Trivy scan prep stage (Alpine CVEs) - c-icap-hardened
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: c-icap-hardened-prep:scan
          format: sarif
          output: trivy-c-icap-hardened-deps.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'
          ignore-unfixed: true

      - name: Upload prep SARIF - c-icap-hardened
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-c-icap-hardened-deps.sarif
          category: c-icap-hardened-deps

      - name: SBOM of prep stage (CycloneDX) - c-icap-hardened
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: c-icap-hardened-prep:scan
          format: cyclonedx
          output: sbom-prep-c-icap-hardened.cdx.json

      - name: Upload prep SBOM - c-icap-hardened
        uses: actions/upload-artifact@v7
        with:
          name: sbom-prep-c-icap-hardened
          path: sbom-prep-c-icap-hardened.cdx.json
          if-no-files-found: error

      - name: Trivy gate prep stage (fail on fixable CRITICAL) - c-icap-hardened
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: c-icap-hardened-prep:scan
          format: table
          severity: CRITICAL
          exit-code: '1'
          ignore-unfixed: true

      - name: Build prep stage (Alpine with runtime deps) - squid-hardened
        uses: docker/build-push-action@v7
        with:
          build-args: ${{ steps.build-args.outputs.build-args }}
          context: squid/
          file: squid/Dockerfile
          target: prep
          platforms: linux/amd64
          load: true
          tags: squid-hardened-prep:scan
          no-cache-filters: prep
          cache-from: type=gha,scope=squid-hardened-prep

      - name: Trivy scan prep stage (Alpine CVEs) - squid-hardened
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: squid-hardened-prep:scan
          format: sarif
          output: trivy-squid-hardened-deps.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'
          ignore-unfixed: true

      - name: Upload prep SARIF - squid-hardened
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-squid-hardened-deps.sarif
          category: squid-hardened-deps

      - name: SBOM of prep stage (CycloneDX) - squid-hardened
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: squid-hardened-prep:scan
          format: cyclonedx
          output: sbom-prep-squid-hardened.cdx.json

      - name: Upload prep SBOM - squid-hardened
        uses: actions/upload-artifact@v7
        with:
          name: sbom-prep-squid-hardened
          path: sbom-prep-squid-hardened.cdx.json
          if-no-files-found: error

      - name: Trivy gate prep stage (fail on fixable CRITICAL) - squid-hardened
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: squid-hardened-prep:scan
          format: table
          severity: CRITICAL
          exit-code: '1'
          ignore-unfixed: true

      # squid and c-icap compile from source (~9-10 min for squid alone).
      # Two prior attempts at sharing build-dockerfile's `type=gha` cache
      # through `docker compose build`/`buildx bake` (docker-compose.ci.yml
      # override, then COMPOSE_BAKE=true) both wrote valid cache entries but
      # never actually got a hit from build-dockerfile's cache -- no
      # measurable speedup either time, most likely a cache-key mismatch
      # between compose/bake's build invocation and build-push-action's.
      # Using the exact same action build-dockerfile uses, with the exact
      # same cache scope, sidesteps that entirely: same tool, same key
      # derivation, guaranteed-compatible cache.
      #
      # On a real push/tag (PUBLISH=true), each image is pushed by digest;
      # `test` below pulls back BY THAT EXACT DIGEST for the functional
      # test -- not "an image that should be identical thanks to cache",
      # the literal bytes now sitting in the registry. If that digest
      # passes, build-dockerfile/merge-dockerfile reuse it as-is for the
      # published manifest; nothing gets rebuilt between "we tested this"
      # and "this is what ships". On a PR there's no registry to push to,
      # so each image is exported to a local tarball for `test` to load.
      - name: Make room for local tarball export (PR only)
        if: env.PUBLISH != 'true'
        run: mkdir -p /tmp/image-tar

      - name: Build clamav-hardened
        id: build-clamav
        uses: docker/build-push-action@v7
        with:
          build-args: ${{ steps.build-args.outputs.build-args }}
          context: clamav/
          file: clamav/Dockerfile
          platforms: linux/amd64
          outputs: ${{ env.PUBLISH == 'true' && format('type=image,name={0}/{1}/clamav-hardened,push-by-digest=true,name-canonical=true,push=true', env.REGISTRY, env.NAMESPACE) || 'type=docker,dest=/tmp/image-tar/clamav-hardened.tar' }}
          sbom: ${{ env.PUBLISH }}
          provenance: ${{ env.PUBLISH == 'true' && 'mode=max' || 'false' }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          tags: ${{ env.PUBLISH != 'true' && 'docker.io/jbsky/clamav-hardened:latest' || '' }}
          cache-from: type=gha,scope=clamav-hardened-linux/amd64
          cache-to: type=gha,mode=max,scope=clamav-hardened-linux/amd64
          # Le stage `prep` porte les paquets Alpine qui finissent dans
          # l'image. Le servir depuis le cache GHA rend deux controles
          # menteurs a la fois : le manifeste compare l'image a une reference
          # generee sur un build frais, et le scan CVE du meme stage examine
          # des paquets perimes. Un controle dont le resultat depend de l'age
          # d'un cache invisible ne controle rien. Le cout est un `apk add`.
          no-cache-filters: prep

      - name: Build c-icap-hardened
        id: build-cicap
        uses: docker/build-push-action@v7
        with:
          build-args: ${{ steps.build-args.outputs.build-args }}
          context: c-icap/
          file: c-icap/Dockerfile
          platforms: linux/amd64
          outputs: ${{ env.PUBLISH == 'true' && format('type=image,name={0}/{1}/c-icap-hardened,push-by-digest=true,name-canonical=true,push=true', env.REGISTRY, env.NAMESPACE) || 'type=docker,dest=/tmp/image-tar/c-icap-hardened.tar' }}
          sbom: ${{ env.PUBLISH }}
          provenance: ${{ env.PUBLISH == 'true' && 'mode=max' || 'false' }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          tags: ${{ env.PUBLISH != 'true' && 'docker.io/jbsky/c-icap-hardened:latest' || '' }}
          cache-from: type=gha,scope=c-icap-hardened-linux/amd64
          cache-to: type=gha,mode=max,scope=c-icap-hardened-linux/amd64
          # Le stage `prep` porte les paquets Alpine qui finissent dans
          # l'image. Le servir depuis le cache GHA rend deux controles
          # menteurs a la fois : le manifeste compare l'image a une reference
          # generee sur un build frais, et le scan CVE du meme stage examine
          # des paquets perimes. Un controle dont le resultat depend de l'age
          # d'un cache invisible ne controle rien. Le cout est un `apk add`.
          no-cache-filters: prep

      - name: Build squid-hardened
        id: build-squid
        uses: docker/build-push-action@v7
        with:
          build-args: ${{ steps.build-args.outputs.build-args }}
          context: squid/
          file: squid/Dockerfile
          platforms: linux/amd64
          outputs: ${{ env.PUBLISH == 'true' && format('type=image,name={0}/{1}/squid-hardened,push-by-digest=true,name-canonical=true,push=true', env.REGISTRY, env.NAMESPACE) || 'type=docker,dest=/tmp/image-tar/squid-hardened.tar' }}
          sbom: ${{ env.PUBLISH }}
          provenance: ${{ env.PUBLISH == 'true' && 'mode=max' || 'false' }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          tags: ${{ env.PUBLISH != 'true' && 'docker.io/jbsky/squid-hardened:latest' || '' }}
          cache-from: type=gha,scope=squid-hardened-linux/amd64
          cache-to: type=gha,mode=max,scope=squid-hardened-linux/amd64
          # Le stage `prep` porte les paquets Alpine qui finissent dans
          # l'image. Le servir depuis le cache GHA rend deux controles
          # menteurs a la fois : le manifeste compare l'image a une reference
          # generee sur un build frais, et le scan CVE du meme stage examine
          # des paquets perimes. Un controle dont le resultat depend de l'age
          # d'un cache invisible ne controle rien. Le cout est un `apk add`.
          no-cache-filters: prep

      - name: Upload image tarballs (PR only, for the test job)
        if: env.PUBLISH != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: image-tar-squid-stack
          path: /tmp/image-tar/
          if-no-files-found: error
          retention-days: 1

  # -------------------------------------------------------------------
  #  Loads the exact bytes `build` just produced (pulled by digest from
  #  the registry, or loaded from their tarball artifact on a PR) and
  #  exercises the real squid -> c-icap -> clamav ICAP chain with an
  #  EICAR download, gating both publish paths below.
  # -------------------------------------------------------------------
  test:
    name: Functional tests (EICAR)
    needs: build
    runs-on: ubuntu-latest
    env:
      PUBLISH: ${{ github.event_name != 'pull_request' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v7

      # Scripts partages (build-revision, image-manifest, ...) : ceux de
      # hardened-ci a la ref epinglee, plus aucune copie dans ce depot.
      - name: Scripts partages de hardened-ci
        id: hci
        uses: jbsky/hardened-ci/tools@9ca47b8942dd2ba041644dd345bbdb34a26ef6d0 # v0.9.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Generate SSL-bump CA (required by squid-explicit.conf)
        run: ./scripts/generate-ca.sh

      - name: Login ghcr.io
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pull back the exact digest just pushed, under the tag docker-compose
      # expects -- guarantees what gets tested below is byte-for-byte what's
      # now in the registry, not a separately-loaded local build.
      - name: Pull back built digests for testing
        if: env.PUBLISH == 'true'
        run: |
          set -euo pipefail
          docker pull "${{ env.REGISTRY }}/${{ env.NAMESPACE }}/clamav-hardened@${{ needs.build.outputs.digest-clamav }}"
          docker tag  "${{ env.REGISTRY }}/${{ env.NAMESPACE }}/clamav-hardened@${{ needs.build.outputs.digest-clamav }}" docker.io/jbsky/clamav-hardened:latest
          docker pull "${{ env.REGISTRY }}/${{ env.NAMESPACE }}/c-icap-hardened@${{ needs.build.outputs.digest-cicap }}"
          docker tag  "${{ env.REGISTRY }}/${{ env.NAMESPACE }}/c-icap-hardened@${{ needs.build.outputs.digest-cicap }}" docker.io/jbsky/c-icap-hardened:latest
          docker pull "${{ env.REGISTRY }}/${{ env.NAMESPACE }}/squid-hardened@${{ needs.build.outputs.digest-squid }}"
          docker tag  "${{ env.REGISTRY }}/${{ env.NAMESPACE }}/squid-hardened@${{ needs.build.outputs.digest-squid }}" docker.io/jbsky/squid-hardened:latest

      - name: Download image tarballs (PR only)
        if: env.PUBLISH != 'true'
        uses: actions/download-artifact@v8
        with:
          name: image-tar-squid-stack
          path: /tmp/image-tar

      - name: Load image tarballs (PR only)
        if: env.PUBLISH != 'true'
        run: |
          set -euo pipefail
          docker load -i /tmp/image-tar/clamav-hardened.tar
          docker load -i /tmp/image-tar/c-icap-hardened.tar
          docker load -i /tmp/image-tar/squid-hardened.tar

      - name: Start stack (images already built/pulled above)
        run: docker compose --profile explicit up -d --no-build

      - name: Wait for clamav + c-icap + squid-explicit healthy
        run: |
          set -euo pipefail
          # clamav's first boot blocks on a real freshclam sync against
          # database.clamav.net before clamd even starts -- typically well
          # under a minute, but generous here since it's third-party network.
          for i in $(seq 1 60); do
            all_healthy=true
            line=""
            for c in clamav c-icap squid-explicit; do
              status=$(docker inspect --format '{{.State.Health.Status}}' "$c" 2>&1) || status="inspect-failed: $status"
              line="$line $c=$status"
              [ "$status" = "healthy" ] || all_healthy=false
            done
            echo "[$((i*10))s]$line"
            [ "$all_healthy" = "true" ] && exit 0
            sleep 10
          done
          echo "::error::stack did not become healthy in time"
          for c in clamav c-icap squid-explicit; do
            echo "-- $c: OOMKilled=$(docker inspect --format '{{.State.OOMKilled}}' "$c" 2>&1), ExitCode=$(docker inspect --format '{{.State.ExitCode}}' "$c" 2>&1), RestartCount=$(docker inspect --format '{{.RestartCount}}' "$c" 2>&1), Error=$(docker inspect --format '{{.State.Error}}' "$c" 2>&1)"
          done
          docker compose ps -a
          docker compose logs
          exit 1

      # A version tag that does not match the binary inside is the one
      # failure nothing else here catches: php shipped 8.5.8 under an 8.5.9
      # tag for 18 days because only the FROM tag was rewritten, never the
      # digest. Ask the built image what it is, and refuse to publish if it
      # disagrees with what we are about to call it.
      - name: Assert the image is the Squid version we tag it with
        run: |
          set -euo pipefail
          want=$(jq -r .squid versions.json)
          # Capture the probe before extracting: a dead container or a
          # changed banner would otherwise fail the pipeline under
          # `set -e` before a single diagnostic line is printed.
          raw=$(docker exec squid-explicit squid -v 2>&1 || true)
          got=$(printf '%s' "$raw" | grep -oP 'Version \K[0-9][0-9.]*' || true)
          echo "declared: ${want} | image: ${got:-<no version parsed>}"
          if [ "$want" != "$got" ]; then
            echo "::error::image ships Squid ${got:-<unknown>} but would be published as ${want}"
            printf 'probe output:\n%s\n' "$raw" | head -5
            exit 1
          fi

      - name: Assert the image is the c-icap version we tag it with
        run: |
          set -euo pipefail
          want=$(jq -r '."c-icap"' versions.json)
          # Capture the probe before extracting: a dead container or a
          # changed banner would otherwise fail the pipeline under
          # `set -e` before a single diagnostic line is printed.
          raw=$(docker exec c-icap c-icap -V 2>&1 || true)
          got=$(printf '%s' "$raw" | grep -oP '^[0-9][0-9.]*' || true)
          echo "declared: ${want} | image: ${got:-<no version parsed>}"
          if [ "$want" != "$got" ]; then
            echo "::error::image ships c-icap ${got:-<unknown>} but would be published as ${want}"
            printf 'probe output:\n%s\n' "$raw" | head -5
            exit 1
          fi

      - name: Assert the image is the ClamAV version we tag it with
        run: |
          set -euo pipefail
          want=$(jq -r .clamav versions.json)
          # Capture the probe before extracting: a dead container or a
          # changed banner would otherwise fail the pipeline under
          # `set -e` before a single diagnostic line is printed.
          raw=$(docker exec clamav clamd --version 2>&1 || true)
          got=$(printf '%s' "$raw" | grep -oP 'ClamAV \K[0-9][0-9.]*' || true)
          echo "declared: ${want} | image: ${got:-<no version parsed>}"
          if [ "$want" != "$got" ]; then
            echo "::error::image ships ClamAV ${got:-<unknown>} but would be published as ${want}"
            printf 'probe output:\n%s\n' "$raw" | head -5
            exit 1
          fi

      # Le manifeste dit ce qui est DANS l'image : chemins, modes, uid/gid,
      # capabilities de fichier, et doublons de contenu. Rien d'autre dans
      # cette chaine ne regarde ca -- hadolint lit le Dockerfile (il verifie
      # qu'une ligne existe, pas qu'elle a marche), et Trivy ne parle que de
      # paquets, dont une image FROM scratch n'a plus aucun. Toute derive
      # echoue ici ; si elle est voulue, regenerer le manifeste DANS LE MEME
      # COMMIT -- c'est le diff qu'on relit dans la PR.
      - name: Image manifests (squid, c-icap, clamav)
        run: |
          set -euo pipefail
          "${{ steps.hci.outputs.dir }}/image-manifest.py" --check docker.io/jbsky/squid-hardened:latest -m squid/image.manifest
          "${{ steps.hci.outputs.dir }}/image-manifest.py" --check docker.io/jbsky/c-icap-hardened:latest -m c-icap/image.manifest
          "${{ steps.hci.outputs.dir }}/image-manifest.py" --check docker.io/jbsky/clamav-hardened:latest -m clamav/image.manifest

      # Ce que l'image embarque, lisible dans le resume du job (hardened-ci
      # v0.9.0) : rendu du manifeste, que --check vient de prouver conforme.
      - name: Image inventory (job summary)
        run: |
          set -euo pipefail
          "${{ steps.hci.outputs.dir }}/image-manifest.py" --report -m squid/image.manifest --name "squid-hardened" >> "$GITHUB_STEP_SUMMARY"
          "${{ steps.hci.outputs.dir }}/image-manifest.py" --report -m c-icap/image.manifest --name "c-icap-hardened" >> "$GITHUB_STEP_SUMMARY"
          "${{ steps.hci.outputs.dir }}/image-manifest.py" --report -m clamav/image.manifest --name "clamav-hardened" >> "$GITHUB_STEP_SUMMARY"

      # `lddtree` signale une dependance introuvable sur stderr et sort quand
      # meme en 0 : un build peut donc publier une image `FROM scratch` a
      # laquelle il manque une bibliotheque, l'erreur ne sortant qu'au
      # demarrage du conteneur, en production. C'est exactement ce qui est
      # arrive ici le 2026-08-28 : `apk add bzip2` n'installe pas libbz2.so.1
      # (paquet separe), et clamav-hardened a ete publiee sans elle.
      - name: Image closure (squid, c-icap, clamav)
        run: |
          set -euo pipefail
          "${{ steps.hci.outputs.dir }}/check-image-closure.sh" \
            docker.io/jbsky/squid-hardened:latest \
            docker.io/jbsky/c-icap-hardened:latest \
            docker.io/jbsky/clamav-hardened:latest

      - name: EICAR test (squid -> c-icap -> clamav)
        run: ./scripts/test-eicar.sh

      - name: Container logs (on failure)
        if: failure()
        run: docker compose logs

      - name: Teardown
        if: always()
        run: docker compose --profile explicit down -v

      # Only reached if the EICAR test above passed. Exports the exact
      # digests just tested so build-dockerfile/merge-dockerfile can reuse
      # them directly for amd64 instead of building again -- same naming
      # convention (digest-<image>-<platform-slug>) build-dockerfile's own
      # "Export digest"/"Upload digest" steps use, so merge-dockerfile's
      # existing `pattern: digest-<image>-*` download picks these up too.
      - name: Export tested digests (amd64)
        id: export-digests
        if: env.PUBLISH == 'true'
        run: |
          set -euo pipefail
          declare -A digests=(
            [clamav-hardened]="${{ needs.build.outputs.digest-clamav }}"
            [c-icap-hardened]="${{ needs.build.outputs.digest-cicap }}"
            [squid-hardened]="${{ needs.build.outputs.digest-squid }}"
          )
          for name in "${!digests[@]}"; do
            mkdir -p "/tmp/digests/${name}"
            touch "/tmp/digests/${name}/${digests[$name]#sha256:}"
          done

      - name: Upload tested digests (clamav-hardened, linux/amd64)
        if: env.PUBLISH == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: digest-clamav-hardened-linux-amd64
          path: /tmp/digests/clamav-hardened
          if-no-files-found: error
          retention-days: 1

      - name: Upload tested digests (c-icap-hardened, linux/amd64)
        if: env.PUBLISH == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: digest-c-icap-hardened-linux-amd64
          path: /tmp/digests/c-icap-hardened
          if-no-files-found: error
          retention-days: 1

      - name: Upload tested digests (squid-hardened, linux/amd64)
        if: env.PUBLISH == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: digest-squid-hardened-linux-amd64
          path: /tmp/digests/squid-hardened
          if-no-files-found: error
          retention-days: 1

  # -------------------------------------------------------------------
  #  Compute platform matrix from workflow input
  # -------------------------------------------------------------------
  compute-platforms:
    name: Compute platforms
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - id: set
        run: |
          PLATFORMS="${{ inputs.platforms || 'linux/amd64' }}"
          # Convert comma-separated string to JSON array
          MATRIX=$(echo "$PLATFORMS" | jq -Rc 'split(",")')
          echo "matrix=${MATRIX}" >> "$GITHUB_OUTPUT"

  # -------------------------------------------------------------------
  #  Build + Push Dockerfiles → ghcr.io (per-platform, push by digest)
  # -------------------------------------------------------------------
  build-dockerfile:
    name: Build – ${{ matrix.image.name }} (${{ matrix.platform }})
    # Independent of build/test (only the amd64 leg overlaps, and that
    # leg is a no-op -- see below), so it runs in parallel rather than
    # waiting on the amd64 functional test -- merge-dockerfile below
    # explicitly re-checks needs.test.result, so a failed amd64 test
    # still blocks publishing.
    needs: [compute-platforms]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: clamav-hardened
            dockerfile: clamav/Dockerfile
            context: clamav/
            version_key: clamav
          - name: squid-hardened
            dockerfile: squid/Dockerfile
            context: squid/
            version_key: squid
          - name: c-icap-hardened
            dockerfile: c-icap/Dockerfile
            context: c-icap/
            version_key: c-icap
        platform: ${{ fromJson(needs.compute-platforms.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v7

      # Build-args generes depuis versions.json (le controle tourne avec) :
      # chaque docker/build-push-action du job doit les recevoir.
      - name: Build-args depuis versions.json
        id: build-args
        uses: jbsky/hardened-ci/versions@9ca47b8942dd2ba041644dd345bbdb34a26ef6d0 # v0.9.0

      # linux/amd64 is built and pushed by digest in `build`, then
      # functionally tested in `test` (guarantees the exact tested digest
      # is what ships, not a separately-rebuilt one) -- every step below
      # that would build/push/export it again is skipped for that platform,
      # this job only does real work for OTHER requested platforms (e.g.
      # arm64 on a manual multi-platform dispatch). Kept as a real matrix
      # entry rather than excluded outright: a job whose matrix resolves to
      # zero entries doesn't produce a reliable success/skipped result for
      # merge-dockerfile to depend on (confirmed empirically -- it doesn't
      # even show up in the run's job list), and would ALSO try to upload
      # an amd64 digest artifact under the exact same name test already
      # uploads, colliding with it.
      - name: Set up QEMU
        if: matrix.platform != 'linux/amd64'
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        if: matrix.platform != 'linux/amd64'
        uses: docker/setup-buildx-action@v4

      - name: Login ghcr.io
        if: matrix.platform != 'linux/amd64'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login Docker Hub
        if: matrix.platform != 'linux/amd64' && env.HAS_DOCKERHUB == 'true'
        uses: docker/login-action@v4
        env:
          HAS_DOCKERHUB: ${{ secrets.DOCKERHUB_TOKEN != '' }}
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push by digest
        if: matrix.platform != 'linux/amd64'
        id: build
        uses: docker/build-push-action@v7
        with:
          build-args: ${{ steps.build-args.outputs.build-args }}
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.dockerfile }}
          platforms: ${{ matrix.platform }}
          sbom: true
          provenance: mode=max
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          outputs: type=image,"name=${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ matrix.image.name }}",push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.image.name }}-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}-${{ matrix.platform }}
          # Meme raison que sur amd64, et une de plus : deux arches servies
          # depuis des caches d'ages differents publieraient des versions de
          # bibliotheques differentes sous un seul tag.
          no-cache-filters: prep

      - name: Export digest
        if: matrix.platform != 'linux/amd64'
        run: |
          mkdir -p /tmp/digests/${{ matrix.image.name }}
          DIGEST="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${{ matrix.image.name }}/${DIGEST#sha256:}"

      - name: Compute platform slug
        if: matrix.platform != 'linux/amd64'
        id: slug
        run: echo "slug=${PLATFORM//\//-}" >> "$GITHUB_OUTPUT"
        env:
          PLATFORM: ${{ matrix.platform }}

      - name: Upload digest
        if: matrix.platform != 'linux/amd64'
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.image.name }}-${{ steps.slug.outputs.slug }}
          path: /tmp/digests/${{ matrix.image.name }}
          if-no-files-found: error
          retention-days: 1

  # -------------------------------------------------------------------
  #  Merge Dockerfile manifests + tag + sign + scan + attest
  # -------------------------------------------------------------------
  merge-dockerfile:
    name: Merge – ${{ matrix.image.name }}
    needs: [build-dockerfile, test]
    if: needs.build-dockerfile.result == 'success' && needs.test.result == 'success'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image:
          - name: clamav-hardened
            version_key: clamav
          - name: squid-hardened
            version_key: squid
          - name: c-icap-hardened
            version_key: c-icap
    steps:
      # fetch-depth 0: build-revision.sh counts commits, a shallow clone
      # would silently make every image .0
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Scripts partages (build-revision, image-manifest, ...) : ceux de
      # hardened-ci a la ref epinglee, plus aucune copie dans ce depot.
      - name: Scripts partages de hardened-ci
        id: hci
        uses: jbsky/hardened-ci/tools@9ca47b8942dd2ba041644dd345bbdb34a26ef6d0 # v0.9.0

      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests/${{ matrix.image.name }}
          pattern: digest-${{ matrix.image.name }}-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login Docker Hub
        if: env.HAS_DOCKERHUB == 'true'
        uses: docker/login-action@v4
        env:
          HAS_DOCKERHUB: ${{ secrets.DOCKERHUB_TOKEN != '' }}
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Read upstream version and build revision
        id: upstream
        run: |
          set -euo pipefail
          VERSION=$(jq -r '."${{ matrix.image.version_key }}"' versions.json)
          REVISION=$("${{ steps.hci.outputs.dir }}/build-revision.sh" "${{ matrix.image.version_key }}" \
            "${{ matrix.image.version_key }}/" versions.json)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "revision=${VERSION}.${REVISION}" >> "$GITHUB_OUTPUT"
          echo "Tagging ${{ matrix.image.name }} as ${VERSION}.${REVISION} (and ${VERSION}, latest)"

      # Un tag <version>.<revision> est immuable : le routeur l'epingle. Le
      # compteur de chaque image ne compte que les commits sur SON repertoire
      # et versions.json ; un push qui ne touche que squid/ (ou scripts/, ou
      # le workflow) reconstruit aussi c-icap et clamav sur une revision deja
      # publiee et la reecrirait. Tag deja present : rien n'est pousse pour
      # cette image, run vert. Toute autre reponse que 200/404 fait echouer.
      - name: Is this tag already published?
        id: published
        env:
          REPO: ${{ env.NAMESPACE }}/${{ matrix.image.name }}
          TAG: ${{ steps.upstream.outputs.revision }}
        run: |
          set -euo pipefail
          TOKEN=$(curl -fsS "https://${REGISTRY}/token?scope=repository:${REPO}:pull" | jq -r .token)
          CODE=$(curl -sS -o /dev/null -w '%{http_code}' -I \
            -H "Authorization: Bearer ${TOKEN}" \
            -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json' \
            "https://${REGISTRY}/v2/${REPO}/manifests/${TAG}")
          case "$CODE" in
            200) PUBLISHED=true
                 echo "- \`${REPO}:${TAG}\` est deja publie : pas de promotion (aucun input de l'image n'a change)" >> "$GITHUB_STEP_SUMMARY" ;;
            404) PUBLISHED=false
                 echo "- \`${REPO}:${TAG}\` : nouvelle revision, promotion" >> "$GITHUB_STEP_SUMMARY" ;;
            *)   echo "::error::${REGISTRY} a repondu ${CODE} pour ${REPO}:${TAG}"; exit 1 ;;
          esac
          echo "published=${PUBLISHED}" >> "$GITHUB_OUTPUT"

      - name: Create manifest list and push
        if: steps.published.outputs.published == 'false'
        id: manifest
        env:
          HAS_DOCKERHUB: ${{ secrets.DOCKERHUB_TOKEN != '' }}
          DOCKERHUB_NS: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.upstream.outputs.version }}"
          REVISION="${{ steps.upstream.outputs.revision }}"
          IMAGE="${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ matrix.image.name }}"

          # Build tag flags. The revisioned tag is the immutable one: :7.6
          # is overwritten by every rebuild, so without it the build it
          # replaced becomes unreachable. :7.6 and :latest keep floating to
          # the newest build so nothing pinning them has to change.
          TAGS="-t ${IMAGE}:${REVISION} -t ${IMAGE}:${VERSION} -t ${IMAGE}:latest"
          if [ "$HAS_DOCKERHUB" = "true" ]; then
            TAGS="${TAGS} -t docker.io/${DOCKERHUB_NS}/${{ matrix.image.name }}:${REVISION}"
            TAGS="${TAGS} -t docker.io/${DOCKERHUB_NS}/${{ matrix.image.name }}:${VERSION}"
            TAGS="${TAGS} -t docker.io/${DOCKERHUB_NS}/${{ matrix.image.name }}:latest"
          fi
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            GIT_VERSION="${GITHUB_REF_NAME#v}"
            TAGS="${TAGS} -t ${IMAGE}:${GIT_VERSION}"
          fi

          # Collect digests from artifacts
          SOURCES=""
          for f in /tmp/digests/${{ matrix.image.name }}/*; do
            SOURCES="${SOURCES} ${IMAGE}@sha256:$(basename "$f")"
          done

          # Create and push multi-arch manifest
          docker buildx imagetools create ${TAGS} ${SOURCES}

          # Get the manifest list digest
          DIGEST=$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" --format '{{json .Manifest}}' | jq -r '.digest')
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        if: steps.published.outputs.published == 'false'
        uses: sigstore/cosign-installer@v3

      - name: Sign manifest (OIDC keyless)
        if: steps.published.outputs.published == 'false'
        env:
          HAS_DOCKERHUB: ${{ secrets.DOCKERHUB_TOKEN != '' }}
          DOCKERHUB_NS: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          set -euo pipefail
          IMAGE="${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ matrix.image.name }}"
          cosign sign --yes "${IMAGE}@${{ steps.manifest.outputs.digest }}"
          if [ "$HAS_DOCKERHUB" = "true" ]; then
            COSIGN_REPOSITORY="${IMAGE}" \
              cosign sign --yes "docker.io/${DOCKERHUB_NS}/${{ matrix.image.name }}@${{ steps.manifest.outputs.digest }}"
          fi

      - name: Download prep SBOM
        if: steps.published.outputs.published == 'false'
        uses: actions/download-artifact@v8
        with:
          name: sbom-prep-${{ matrix.image.name }}

      - name: Attest prep SBOM (CycloneDX)
        if: steps.published.outputs.published == 'false'
        run: |
          set -euo pipefail
          cosign attest --yes --type cyclonedx --predicate "sbom-prep-${{ matrix.image.name }}.cdx.json" \
            "${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ matrix.image.name }}@${{ steps.manifest.outputs.digest }}"

      - name: Detect scan platform
        if: steps.published.outputs.published == 'false'
        id: scan-platform
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ matrix.image.name }}"
          VERSION="${{ steps.upstream.outputs.version }}"
          # Prefer amd64 (runner-native), fall back to first available
          PLATFORM=$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" \
            --format '{{range .Manifest.Manifests}}{{if eq .Platform.Architecture "amd64"}}linux/amd64{{end}}{{end}}')
          if [ -z "$PLATFORM" ]; then
            PLATFORM=$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" \
              --format '{{with index .Manifest.Manifests 0}}{{.Platform.OS}}/{{.Platform.Architecture}}{{end}}')
          fi
          echo "platform=${PLATFORM}" >> "$GITHUB_OUTPUT"

      - name: Trivy scan
        if: steps.published.outputs.published == 'false'
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_PLATFORM: ${{ steps.scan-platform.outputs.platform }}
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ matrix.image.name }}@${{ steps.manifest.outputs.digest }}
          format: sarif
          output: trivy-${{ matrix.image.name }}.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'
          ignore-unfixed: true

      - name: Upload SARIF
        if: always() && steps.published.outputs.published == 'false'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-${{ matrix.image.name }}.sarif
          category: ${{ matrix.image.name }}

      - name: GitHub SLSA Attestation
        if: "!startsWith(github.ref, 'refs/heads/dependabot/') && steps.published.outputs.published == 'false'"
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ matrix.image.name }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true

      - name: Summary
        if: steps.published.outputs.published == 'false'
        env:
          HAS_DOCKERHUB: ${{ secrets.DOCKERHUB_TOKEN != '' }}
          DOCKERHUB_NS: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          echo "### ${{ matrix.image.name }} (v${{ steps.upstream.outputs.version }})" >> $GITHUB_STEP_SUMMARY
          echo "**Manifest digest :** \`${{ steps.manifest.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          PLATFORMS=$(docker buildx imagetools inspect "${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ matrix.image.name }}:${{ steps.upstream.outputs.version }}" \
            --format '{{range .Manifest.Manifests}}{{.Platform.OS}}/{{.Platform.Architecture}} {{end}}' 2>/dev/null || echo "unknown")
          echo "**Platforms :** ${PLATFORMS}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "docker pull ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ matrix.image.name }}:latest" >> $GITHUB_STEP_SUMMARY
          if [ "$HAS_DOCKERHUB" = "true" ]; then
            echo "docker pull docker.io/${DOCKERHUB_NS}/${{ matrix.image.name }}:latest" >> $GITHUB_STEP_SUMMARY
          fi
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

  # -------------------------------------------------------------------
  # -------------------------------------------------------------------
  #  Le README nomme le tag immuable courant. On le regenere ici pour que la
  #  doc ne puisse jamais designer un tag que les registres ne portent plus.
  # -------------------------------------------------------------------
  update-readme:
    name: Refresh README tag block
    needs: merge-dockerfile
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # fetch-depth 0: build-revision.sh counts commits, a shallow clone
      # would silently make every image .0
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Scripts partages (build-revision, image-manifest, ...) : ceux de
      # hardened-ci a la ref epinglee, plus aucune copie dans ce depot.
      - name: Scripts partages de hardened-ci
        id: hci
        uses: jbsky/hardened-ci/tools@9ca47b8942dd2ba041644dd345bbdb34a26ef6d0 # v0.9.0

      # Rewrite + commit in ONE step. They used to be two, and the retry loop
      # recovered from a lost race with `git pull --rebase || true`: both sides
      # rewrite the same tag block, so the rebase conflicts, `|| true` swallowed
      # it, and every later iteration died on "Pulling is not possible because
      # you have unmerged files" -- a resolvable race turned into a red run
      # (2026-08-28). The README commit is a DERIVED artifact: on a lost race
      # the answer is to throw it away, take the new base and regenerate, never
      # to replay it. Regenerating needs the specs, hence a single step.
      - name: Rewrite tag block and commit
        run: |
          set -euo pipefail

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          rewrite() {
            specs=()
            for key in squid c-icap clamav; do
              case "$key" in
                squid)   img=squid-hardened  ;;
                c-icap)  img=c-icap-hardened ;;
                clamav)  img=clamav-hardened ;;
              esac
              VERSION=$(jq -r --arg k "$key" '.[$k]' versions.json)
              REVISION=$("${{ steps.hci.outputs.dir }}/build-revision.sh" "$key" "$key/" versions.json)
              specs+=("jbsky/${img}=${VERSION}=${VERSION}.${REVISION}")
            done
            "${{ steps.hci.outputs.dir }}/update-readme-tags.sh" "${specs[@]}"
          }

          for attempt in 1 2 3; do
            rewrite
            # `git diff --quiet && exit 0` would abort the step under `set -e`
            # on the branch where there IS a change: use an explicit if.
            if git diff --quiet README.md; then
              echo "README already names the current tag"
              exit 0
            fi
            git add README.md
            git commit -m "docs(readme): tag immuable courant [skip ci]"
            if git push; then
              exit 0
            fi
            echo "push rejete (publish concurrent) -- on repart de origin/main"
            git fetch origin main
            git reset --hard origin/main
          done
          echo "::error::README tag block: 3 tentatives perdues face a des publish concurrents"
          exit 1

  cleanup:
    name: Prune old registry tags
    needs: merge-dockerfile
    # Un workflow appele ne peut que reduire les permissions : les donner ici.
    permissions:
      contents: read
      packages: write
    uses: jbsky/hardened-ci/.github/workflows/registry-cleanup.yml@9ca47b8942dd2ba041644dd345bbdb34a26ef6d0 # v0.9.0
    with:
      images: '["squid-hardened","c-icap-hardened","clamav-hardened"]'
    # Explicites : `secrets: inherit` n'est pas garanti entre depots d'un
    # compte personnel.
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  # -------------------------------------------------------------------
  #  Release sur tag v*.*.* : tarball + checksums
  # -------------------------------------------------------------------
  release:
    name: GitHub Release
    needs: [merge-dockerfile]
    # `always()` keeps this reachable when an upstream job is skipped; the
    # explicit result check is what actually gates it.
    if: always() && startsWith(github.ref, 'refs/tags/v') && needs.merge-dockerfile.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Tarball + checksums
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          mkdir -p dist
          tar --exclude='.git' --exclude='dist' --exclude='certs/bump.*' \
              --exclude='certs/dhparam*' --exclude='.env' \
              -czf "dist/squid-stack-${VERSION}.tar.gz" \
              --transform "s,^,squid-stack-${VERSION}/," \
              $(ls -A | grep -v -E '^(\.git|dist)$')
          cd dist
          sha256sum "squid-stack-${VERSION}.tar.gz" > "squid-stack-${VERSION}.sha256"
          sha512sum "squid-stack-${VERSION}.tar.gz" > "squid-stack-${VERSION}.sha512"

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            dist/squid-stack-${{ github.ref_name }}.tar.gz
            dist/squid-stack-${{ github.ref_name }}.sha256
            dist/squid-stack-${{ github.ref_name }}.sha512

  # -------------------------------------------------------------------
  #  Un build rouge hors PR ne prevenait personne : version-watch reste vert
  #  (il ne fait que dispatcher), et du 2026-09-10 au 09-30 tous les rebuilds
  #  ont echoue en silence -- des correctifs de securite jamais publies.
  #  Une seule issue par branche : ouverte au premier echec, commentee tant
  #  que ca dure, fermee par le premier run vert. Pas sur pull_request : les
  #  PR Dependabot n'ont qu'un jeton en lecture, et la PR montre deja le rouge.
  # -------------------------------------------------------------------
  notify:
    name: Issue si echec
    needs: [lint, build, test, compute-platforms, build-dockerfile, merge-dockerfile, update-readme, cleanup, release]
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v9
        env:
          NEEDS: ${{ toJSON(needs) }}
        with:
          script: |
            const needs = JSON.parse(process.env.NEEDS);
            const rouges = Object.entries(needs)
              .filter(([, j]) => j.result === 'failure' || j.result === 'cancelled')
              .map(([nom]) => nom);
            const branche = context.ref.replace(/^refs\/(heads|tags)\//, '');
            const titre = `[CI] build-push en echec sur ${branche}`;
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data: ouvertes } = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', labels: 'ci-failure', per_page: 100 });
            const issue = ouvertes.find(i => i.title === titre);
            if (rouges.length) {
              const corps = `Run \`${context.eventName}\` sur ${context.sha.slice(0, 7)} en echec `
                + `(${rouges.join(', ')}) : ${run}`;
              if (issue) {
                await github.rest.issues.createComment({ ...context.repo, issue_number: issue.number, body: corps });
              } else {
                await github.rest.issues.create({ ...context.repo, title: titre, body: corps,
                  labels: ['ci-failure', 'automated'] });
              }
            } else if (issue) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: issue.number,
                body: `Repasse au vert : ${run}` });
              await github.rest.issues.update({ ...context.repo, issue_number: issue.number, state: 'closed' });
            }
