# =====================================================================
#  security-audit -- audit hebdomadaire des 3 images publiees.
#  La logique vit dans jbsky/hardened-ci (gabarit reutilisable, matrice sur
#  les images de .github/hardened-ci.json : une issue par image).
#  Ce fichier ne porte que le planning -- il faisait 140 lignes.
# =====================================================================
name: security-audit

on:
  schedule:
    - cron: '0 3 * * 2'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    uses: jbsky/hardened-ci/.github/workflows/security-audit.yml@78163b0f20b2edfa0d5f5c5d92a675b0d3198b15 # v1.4.12
    permissions:
      contents: read
      packages: read
      security-events: write
      issues: write
