# =====================================================================
#  security-audit -- audit hebdomadaire des 3 images publiees.
#  La logique vit dans jbsky/hardened-ci (gabarit reutilisable, matrice sur
#  les images de .github/hardened-ci.json : une issue par image).
#  Ce fichier ne porte que le planning -- il faisait 140 lignes.
# =====================================================================
name: security-audit

on:
  schedule:
    - cron: '0 3 * * 2'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    uses: jbsky/hardened-ci/.github/workflows/security-audit.yml@6ace661b63b5fc0f82bbf930037851c64e5af9e8 # v1.4.7
    permissions:
      contents: read
      packages: read
      security-events: write
      issues: write
