# =====================================================================
#  Audit securite hebdomadaire — Stack Squid (3 images)
#  - Trivy (CVE + secrets + misconfig) sur squid, c-icap, clamav
#  - Grype (cross-check)
#  - Verification signature cosign
# =====================================================================
name: security-audit

on:
  schedule:
    - cron: '0 3 * * 2'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}

permissions:
  contents: read
  security-events: write
  packages: read
  issues: write

jobs:
  audit:
    name: Audit ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - squid-hardened
          - c-icap-hardened
          - clamav-hardened
    steps:
      # fetch-depth 0 : build-revision.sh compte les commits, un clone
      # superficiel ferait de chaque image une .0
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Scripts partages (build-revision, image-manifest, ...) : ceux de
      # hardened-ci a la ref epinglee, plus aucune copie dans ce depot.
      - name: Scripts partages de hardened-ci
        id: hci
        uses: jbsky/hardened-ci/tools@aec6950c16450b3af197516e433fb067c7036dd7 # v1.1.0

      # Trivy ne voit dans cette image FROM scratch que ce qui garde une
      # metadonnee de paquet (binaire Go d'init) : le service et ses
      # bibliotheques C n'ont plus de base apk a lire. Un « 0 CVE » ne prouve
      # donc rien sur elles. Ce qui les garde a jour, c'est la reconstruction --
      # et du 2026-09-10 au 09-30 plus aucune n'aboutissait, en silence. Cette
      # etape verifie que le tag que main doit produire existe dans le registre.
      - name: main est publie
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          set -euo pipefail
          KEY="${IMAGE%-hardened}"
          VERSION=$(jq -r --arg k "$KEY" '.[$k]' versions.json)
          REVISION=$("${{ steps.hci.outputs.dir }}/build-revision.sh" "$KEY" "$KEY/" versions.json)
          TAG="${VERSION}.${REVISION}"
          if docker manifest inspect "${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}:${TAG}" >/dev/null; then
            echo "OK -- ${TAG} est publie"
          else
            echo "::error::main devrait publier ${{ matrix.image }}:${TAG}, absent du registre -- le dernier build-push de main a echoue ?"
            exit 1
          fi

      - name: Trivy full scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}:latest
          format: sarif
          output: trivy-${{ matrix.image }}.sarif
          severity: CRITICAL,HIGH,MEDIUM
          scanners: vuln,secret,misconfig
          ignore-unfixed: false

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-${{ matrix.image }}.sarif
          category: audit-${{ matrix.image }}

      # Trivy is a gate, not just a printout. On 2026-08-18 grype reported
      # "No vulnerabilities found" on squid/c-icap/clamav/bind9 :latest while
      # trivy listed 8 High Go stdlib CVEs in the very same init binary -- the
      # audits stayed green for weeks while shipping them. Two scanners are
      # only worth running if both can fail the job; `ignore-unfixed` keeps
      # the semantics aligned with grype's `--only-fixed`.
      - name: Trivy summary
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}:latest
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true

      # Action epinglee plutot que `curl .../grype/main/install.sh | sh` : le
      # script d'installation suivait la branche main d'un depot tiers, sans
      # version ni empreinte. Memes seuils qu'avant (high+, corrigeables).
      - name: Grype scan
        uses: anchore/scan-action@v7
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}:latest
          fail-build: 'true'
          severity-cutoff: high
          only-fixed: 'true'
          output-format: table

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Verify cosign signature
        run: |
          cosign verify ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}:latest \
            --certificate-identity-regexp "^https://github.com/${{ github.repository }}/" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com

  notify:
    name: Notification si echec
    needs: audit
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Issue automatique
        uses: actions/github-script@v9
        with:
          script: |
            const today = new Date().toISOString().split('T')[0];
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[Security] Weekly audit failed - ${today}`,
              body: `Audit du ${today} a detecte des CVE ou un echec de verification. Voir le run.\n\n${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['security','automated']
            });
